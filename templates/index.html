{% extends "base.html" %}
{% block title %}MBTI职业性格测试 - 首页{% endblock %}
{% block user_content %}
<div class="hero-section">
    <h1>🔮 MBTI职业性格测试</h1>
    <p>2026最新版 · 发现你的性格密码</p>
</div>

<div class="login-section fade-in">
    <h3 style="margin-bottom:16px; color:#333;">🚀 开始测试</h3>

    <form action="{{ url_for('select_source') }}" method="POST">
        <div class="form-group">
            <label>昵称（选填）</label>
            <input type="text" name="nickname" placeholder="选填，不填默认“测试用户”" maxlength="12" autocomplete="off">
        </div>

        {% if tests %}
        <div class="form-group">
            <label>选择测试版本（点击直接开始）</label>
            <div style="display:flex; flex-direction:column; gap:10px;">
                {% for test in tests %}
                <label class="version-card" style="display:block; cursor:pointer;">
                    <input type="radio" name="test_id" value="{{ test.id }}" style="display:none;">
                    <h3>{{ test.name }}<span class="meta-time">⏱️ {{ test.estimated_time }}分钟</span></h3>
                </label>
                {% endfor %}
            </div>
        </div>

        {% else %}
        <div class="empty-state">
            <div class="icon">📭</div>
            <p>测试暂时还没发布，请稍后再来</p>
        </div>
        {% endif %}
    </form>
</div>

<div style="padding:20px; text-align:center; color:#aaa; font-size:12px;">
    <p>💡 提示：无对错，凭感觉，尽兴选</p>
</div>
<script>
(function () {
    var form = document.querySelector('form');
    var cards = document.querySelectorAll('.version-card');
    if (!cards.length) return;

    function syncSelected() {
        cards.forEach(function (card) {
            var radio = card.querySelector('input[type="radio"]');
            card.classList.toggle('selected', !!(radio && radio.checked));
        });
    }
    cards.forEach(function (card) {
        card.addEventListener('click', function () {
            var radio = card.querySelector('input[type="radio"]');
            if (!radio) return;
            radio.checked = true;
            syncSelected();
            form.requestSubmit();
        });
    });

    // 提交前校验：必须选择版本（点击版本卡片时已自动选中）
    form.addEventListener('submit', function (e) {
        var selected = document.querySelector('input[name="test_id"]:checked');
        if (!selected) {
            e.preventDefault();
            alert('请选择测试版本～');
        }
    });
})();
</script>
{% endblock %}
